[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terramow-ha"
version = "0.3.0"
description = "Home Assistant integration for TerraMow robotic lawn mowers"
readme = "README.md"
requires-python = ">=3.13.2"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "paho-mqtt>=1.6.1",
    "Pillow>=9.0.0",
]

[dependency-groups]
dev = [
    "debugpy==1.8.21; python_full_version >= '3.14.2'",
    "homeassistant==2026.7.2; python_full_version >= '3.14.2'",
    "pytest-homeassistant-custom-component==0.13.346; python_full_version >= '3.14.2'",
    "ruff==0.15.7",
    "mypy>=1.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.terramow"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "paho.mqtt.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/terramow"]
