[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terramow-ha"
version = "0.3.6"
description = "Home Assistant integration for TerraMow robotic lawn mowers"
readme = "README.md"
requires-python = ">=3.13.2"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiomqtt>=2.0.0",
    "Pillow>=9.0.0",
]

[dependency-groups]
dev = [
    "debugpy==1.8.21; python_full_version >= '3.14.2'",
    "homeassistant==2026.7.2; python_full_version >= '3.14.2'",
    "pytest-homeassistant-custom-component==0.13.346; python_full_version >= '3.14.2'",
    "PyTurboJPEG==1.8.3",
    "ruff==0.15.7",
    "mypy>=1.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.terramow"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["custom_components/terramow"]
# custom_components has no __init__.py; resolve module names from the
# repository root so they read custom_components.terramow.*.
explicit_package_bases = true

# Baseline: modules that did not pass mypy when the CI check was added.
# Errors in them are not reported yet; every other module, including any new
# one, must pass. The list may only shrink: fix a module, then remove it here.
# See "Quality gates" in docs/en/developers.md.
[[tool.mypy.overrides]]
module = [
    "custom_components.terramow.binary_sensor",
    "custom_components.terramow.calendar",
    "custom_components.terramow.camera",
    "custom_components.terramow.config_flow",
    "custom_components.terramow.lawn_mower",
    "custom_components.terramow.map_sensor",
    "custom_components.terramow.number",
    "custom_components.terramow.schedule",
    "custom_components.terramow.select",
    "custom_components.terramow.sensor",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/terramow"]
branch = true

[tool.coverage.report]
# Coverage floor: only goes up. See "Quality gates" in docs/en/developers.md.
fail_under = 65.5
precision = 2
show_missing = true
skip_empty = true
